name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-ventas:
    name: Backend Ventas - Build y Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('back-Ventas_SpringBoot/Springboot-API-REST/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make Maven wrapper executable
        run: chmod +x back-Ventas_SpringBoot/Springboot-API-REST/mvnw

      - name: Build and test backend ventas
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
        run: ./mvnw -B clean test -Dspring.profiles.active=ci

  build-despacho:
    name: Backend Despachos - Build y Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make Maven wrapper executable
        run: chmod +x back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/mvnw

      - name: Build and test backend despacho
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: ./mvnw -B clean test -Dspring.profiles.active=ci

  build-frontend:
    name: Frontend - Build y Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: front_despacho
        run: npm ci

      - name: Frontend lint
        working-directory: front_despacho
        run: npm run lint

      - name: Build frontend
        working-directory: front_despacho
        run: npm run build

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-ventas, build-despacho, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ventas Docker image
        run: |
          docker build \
            -f back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile \
            -t ventas-backend:ci \
            back-Ventas_SpringBoot/Springboot-API-REST

      - name: Build Despachos Docker image
        run: |
          docker build \
            -f back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile \
            -t despacho-backend:ci \
            back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

      - name: Build Frontend Docker image
        run: |
          docker build \
            -f front_despacho/Dockerfile \
            -t despacho-frontend:ci \
            front_despacho

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-ventas, build-despacho, build-frontend, build-docker-images]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "✓ Backend Ventas built and tested"
          echo "✓ Backend Despachos built and tested"
          echo "✓ Frontend built and linted"
          echo "✓ Docker images built for local deployment"
