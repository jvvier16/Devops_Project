name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # 🧪 Build y Test Backend Ventas
  build-ventas:
    runs-on: ubuntu-latest
    name: Build Ventas Backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
        run: mvn -B clean package
      
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ventas-backend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ventas-backend:latest \
            back-Ventas_SpringBoot/Springboot-API-REST
      
      - name: Push Docker Image
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ${{ env.REGISTRY_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ventas-backend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ventas-backend:latest

  # 🧪 Build y Test Backend Despachos
  build-despacho:
    runs-on: ubuntu-latest
    name: Build Despacho Backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: mvn -B clean package
      
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/despacho-backend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/despacho-backend:latest \
            back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      
      - name: Push Docker Image
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ${{ env.REGISTRY_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/despacho-backend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/despacho-backend:latest

  # 🧪 Build Frontend
  build-frontend:
    runs-on: ubuntu-latest
    name: Build Frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front_despacho/package-lock.json
      
      - name: Install Dependencies
        working-directory: front_despacho
        run: npm ci
      
      - name: Build
        working-directory: front_despacho
        run: npm run build
      
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/despacho-frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/despacho-frontend:latest \
            --build-arg VITE_VENTAS_API_URL=http://ventas-backend:8080 \
            --build-arg VITE_DESPACHOS_API_URL=http://despacho-backend:8081 \
            front_despacho
      
      - name: Push Docker Image
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ${{ env.REGISTRY_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/despacho-frontend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/despacho-frontend:latest

  # ✅ Integration Test
  integration-test:
    runs-on: ubuntu-latest
    name: Integration Test
    needs: [build-ventas, build-despacho, build-frontend]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: example
          MYSQL_DATABASE: ventas_db
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize MySQL
        run: |
          mysql -h 127.0.0.1 -u root -pexample < infra/mysql-init/init.sql
      
      - name: Verify Services
        run: |
          echo "✓ All builds completed successfully"
          echo "✓ Docker images ready for deployment"
