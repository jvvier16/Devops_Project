name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # 🧪 Build y Test Backend Ventas
  build-ventas:
    runs-on: ubuntu-latest
    name: Build Ventas Backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build and Test with Maven
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
        run: mvn clean package -Dspring.profiles.active=ci

  # 🧪 Build y Test Backend Despachos
  build-despacho:
    runs-on: ubuntu-latest
    name: Build Despacho Backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build and Test with Maven
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: mvn clean package -Dspring.profiles.active=ci

  # 🧪 Build Frontend
  build-frontend:
    runs-on: ubuntu-latest
    name: Build Frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'front_despacho/package-lock.json'
      
      - name: Install and Build
        working-directory: front_despacho
        run: |
          npm ci
          npm run build

  # ✅ Summary
  summary:
    runs-on: ubuntu-latest
    name: Build Summary
    needs: [build-ventas, build-despacho, build-frontend]
    if: always()
    
    steps:
      - name: Report Status
        run: |
          echo "✓ All builds completed successfully"
          echo "✓ Ready for Docker build and AWS deployment"
