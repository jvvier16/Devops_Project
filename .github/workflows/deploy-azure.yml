name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Azure
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      
      - name: Terraform Init
        working-directory: infra/etapa_2
        run: terraform init
      
      - name: Terraform Plan
        working-directory: infra/etapa_2
        run: terraform plan
        env:
          TF_VAR_aws_region: us-east-1
          TF_VAR_project_name: devops-u2
      
      - name: Completion
        run: |
          echo "✅ Terraform plan completed"
          echo "Ready for manual terraform apply with AWS credentials"
