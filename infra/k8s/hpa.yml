# Horizontal Pod Autoscaler para Backend Despacho
# Escala automáticamente entre 2-5 replicas basado en CPU (50%) y Memory (70%)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-despacho-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-despacho
  minReplicas: 2
  maxReplicas: 5
  metrics:
    # Métrica 1: CPU (50% utilización)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    # Métrica 2: Memoria (70% utilización)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  # Comportamiento de escalado
  behavior:
    # Scale Down: reducir lentamente
    scaleDown:
      stabilizationWindowSeconds: 300  # Espera 5 minutos antes de reducir
      policies:
        - type: Percent
          value: 50  # Reduce 50% de replicas
          periodSeconds: 60
    # Scale Up: aumentar rápidamente
    scaleUp:
      stabilizationWindowSeconds: 0  # Sube inmediatamente
      policies:
        - type: Percent
          value: 100  # Duplica replicas
          periodSeconds: 30

---

# Horizontal Pod Autoscaler para Frontend Despacho
# Escala automáticamente entre 1-3 replicas basado en CPU (60%)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-despacho-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-despacho
  minReplicas: 1
  maxReplicas: 3
  metrics:
    # Métrica: CPU (60% utilización)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

---

# PodDisruptionBudget para garantizar disponibilidad durante mantenimiento
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-despacho-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend-despacho
