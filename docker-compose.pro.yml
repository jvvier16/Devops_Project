version: '3.9'

services:
  # Backend Ventas - API REST
  ventas-backend:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: Dockerfile
    container_name: ventas-backend
    environment:
      - DB_ENDPOINT=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-asistencia_db}
      - DB_USERNAME=${DB_USERNAME:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-YourSecurePassword123!}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${DB_NAME:-asistencia_db}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-admin}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-YourSecurePassword123!}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JAVA_OPTS=-Xmx512m -Xms256m
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend Despachos - API REST
  despacho-backend:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    container_name: despacho-backend
    environment:
      - DB_ENDPOINT=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-asistencia_db}
      - DB_USERNAME=${DB_USERNAME:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-YourSecurePassword123!}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${DB_NAME:-asistencia_db}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-admin}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-YourSecurePassword123!}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JAVA_OPTS=-Xmx512m -Xms256m
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend
  frontend:
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
      args:
        VITE_VENTAS_API_URL: ${VITE_VENTAS_API_URL:-http://localhost:80/api/ventas}
        VITE_DESPACHOS_API_URL: ${VITE_DESPACHOS_API_URL:-http://localhost:80/api/despachos}
    container_name: despacho-frontend
    ports:
      - "80:80"
    depends_on:
      - ventas-backend
      - despacho-backend
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Base de Datos MySQL
  mysql:
    image: mysql:8-oracle
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-YourSecurePassword123!}
      MYSQL_DATABASE: ${DB_NAME:-asistencia_db}
      MYSQL_USER: ${DB_USERNAME:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-YourSecurePassword123!}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-YourSecurePassword123!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: 
      - --bind-address=0.0.0.0
      - --performance-schema=OFF
      - --max_connections=1000
      - --default-storage-engine=InnoDB
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  devops-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
