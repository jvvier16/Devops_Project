global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'despacho-app'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - '/etc/prometheus/rules.yml'

scrape_configs:
  - job_name: 'ventas-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ventas-backend:8080']
    scrape_interval: 10s

  - job_name: 'despacho-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['despacho-backend:8081']
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mysql'
    static_configs:
      - targets: ['db:3306']
