global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
    # Configurar notificaciones (email, slack, etc)

  - name: 'critical'
    # Alertas críticas van aquí
    # webhook_configs:
    #   - url: 'http://localhost:5000/alert'

  - name: 'warning'
    # Alertas de aviso van aquí

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']
